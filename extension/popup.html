<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 16px;
      background: #fff;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #0066cc;
    }
    input[readonly] {
      background: #f5f5f5;
      color: #666;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #0052a3;
    }
    button:active {
      background: #004080;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="setupScreen">
    <h2>Setup</h2>
    <label for="apiUrl">API URL</label>
    <input type="text" id="apiUrl" placeholder="https://your-app.vercel.app">

    <label for="token">Bearer Token</label>
    <input type="password" id="token" placeholder="Your API token">

    <button id="saveConfigBtn">Save</button>
    <div id="setupStatus" class="status"></div>
  </div>

  <div id="formScreen" class="hidden">
    <h2>Save Item</h2>
    <label for="url">URL</label>
    <input type="text" id="url" readonly>

    <label for="title">Title</label>
    <input type="text" id="title" placeholder="Page title">

    <label for="tags">Tags</label>
    <input type="text" id="tags" placeholder="tag1, tag2, tag3">

    <label for="comment">Comment</label>
    <textarea id="comment" placeholder="Optional notes"></textarea>

    <button id="saveItemBtn">Save</button>
    <div id="formStatus" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
